name: istara-pi-model-migration-20260822-acceptance
services:
  app:
    cap_drop:
      - ALL
    cpus: 1
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/api/health
      timeout: 5s
      interval: 30s
      retries: 3
    image: istara-pi-model-migration-acceptance@sha256:9a0e7e3d4b1f2c8a5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c
    mem_limit: "536870912"
    networks:
      workload: null
    pids_limit: 256
    ports:
      - mode: host
        target: 8000
        published: "18443"
        protocol: tcp
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
      - /app/data:rw,nosuid,nodev,uid=999,gid=999,mode=0750,size=2G
networks:
  workload:
    name: istara-pi-model-migration-20260822-acceptance_workload
    driver: bridge
    internal: true
