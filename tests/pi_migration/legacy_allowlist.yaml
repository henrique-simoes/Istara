  # legacy ollama/llm_router branch preserved alongside it, so the sites stay
  # allowlisted (line keys updated) and the ratchet stays at 70 until the
  # legacy branch is retired.
  # W6 routed the 14 autoresearch-runner chat sites (model_temp
  # evaluate/score, persona hypothesize/evaluate/score, question_bank
  # hypothesize/evaluate/score, rag_params hypothesize, skill_prompt
  # hypothesize/evaluate/score, ui_sim hypothesize/evaluate) through the
  # AgenticDispatcher behind the same `agentic_core` feature flag with the
  # legacy llm_router branch preserved alongside it, so the sites stay
  # allowlisted (line keys updated) and the ratchet stays at 70 until the
  # legacy branch is retired. The rag_params retrieval-eval embed stays on the
  # legacy plane until W8 (tracked separately in the embed section).
  expected_product_sites: 70

