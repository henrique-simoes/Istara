# Pi full-replacement — legacy-plane call-site allowlist (master plan §4.2).
#
# This is the ONLY file allowed to authorize a direct legacy-plane call
# (ollama.* / llm_router.* / compute_registry.* aliases, direct per-node
# dispatch, ChatOpenAI browser bypass) in backend/app/.
#
# Each wave removes the product sites it migrated and lowers
# ratchet.expected_product_sites by exactly that many. Final state (W9):
# `product` is empty, expected_product_sites is 0, and only `permanent`
# remains. Any new direct call added later fails CI.
#
# Written in a tiny YAML subset (flow lists + quoted scalars only) so it can
# be parsed without pyyaml; see tests/pi_migration/test_count_to_zero.py.

ratchet:
  # W0 baseline: 69 chat + 17 embed + 1 browser bypass = 87 product sites.
  # W2 (complete) migrated all 9 interactive surfaces to the AgenticDispatcher:
  # the 4 one-shot completion surfaces (context_dag DAG compaction,
  # context_summarizer, presentation slide-instruction, UI-audit heuristics),
  # the 4 streaming ReAct loops (chat.py native tools + text fallback,
  # interfaces.py design native tools + design text fallback), and the
  # browser_service browse_website tool (endpoint identity now resolved via
  # PiModelManager; see the F-W2-1b governance decision in
  # scripts/pi_migration_inventory.py). The ratchet drops by 9.
  # W3 migrated the 8 research-spine + steering sites (master plan §8 W3):
  # agent_research.py L1 ReAct (:129,:131), L2 planner (:478), L3 step
  # executor (:667), L5 reflection verifier (:1062), self_check.py L6 claim
  # verification (:75), agent_execution.py L7 skill reflection (:472), and
  # agent_lifecycle.py L10 steering reply (:519). The ratchet drops by 8.
  # W4 routed the 3 A2A handler sites (agent_lifecycle.py collaboration,
  # debate synthesis, debate critique) through the AgenticDispatcher behind
  # the `agentic_core` feature flag with the legacy ollama branch preserved
  # alongside it, so the sites stay allowlisted (line keys updated) and the
  # ratchet stays at 70 until the legacy branch is retired.
  expected_product_sites: 70

