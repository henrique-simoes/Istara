# Pi full-replacement — legacy-plane call-site allowlist (master plan §4.2).
#
# This is the ONLY file allowed to authorize a direct legacy-plane call
# (ollama.* / llm_router.* / compute_registry.* aliases, direct per-node
# dispatch, ChatOpenAI browser bypass) in backend/app/.
#
# Each wave removes the product sites it migrated and lowers
# ratchet.expected_product_sites by exactly that many. Final state (W9,
# reached): `product` is empty, expected_product_sites is 0, and only
# `permanent` remains. Any new direct call added later fails CI.
#
# Written in a tiny YAML subset (flow lists + quoted scalars only) so it can
# be parsed without pyyaml; see tests/pi_migration/test_count_to_zero.py.

ratchet:
  # W0 baseline: 69 chat + 17 embed + 1 browser bypass = 87 product sites.
  # W2 (complete) migrated all 9 interactive surfaces to the AgenticDispatcher:
  # the 4 one-shot completion surfaces (context_dag DAG compaction,
  # context_summarizer, presentation slide-instruction, UI-audit heuristics),
  # the 4 streaming ReAct loops (chat.py native tools + text fallback,
  # interfaces.py design native tools + design text fallback), and the
  # browser_service browse_website tool (endpoint identity now resolved via
  # PiModelManager; see the F-W2-1b governance decision in
  # scripts/pi_migration_inventory.py). The ratchet drops by 9.
  # W3 migrated the 8 research-spine + steering sites (master plan §8 W3):
  # agent_research.py L1 ReAct (:129,:131), L2 planner (:478), L3 step
  # executor (:667), L5 reflection verifier (:1062), self_check.py L6 claim
  # verification (:75), agent_execution.py L7 skill reflection (:472), and
  # agent_lifecycle.py L10 steering reply (:519). The ratchet drops by 8.
  # W4 routed the 3 A2A handler sites (agent_lifecycle.py collaboration,
  # debate synthesis, debate critique) through the AgenticDispatcher behind
  # the `agentic_core` feature flag with the legacy ollama branch preserved
  # alongside it, so the sites stayed allowlisted and the ratchet stayed at
  # 70 until the legacy branch was retired.
  # W5 routed the 28 skills/reports/interview-services sites (skill_factory
  # plan/execute + 3-stage repair chain, the 4 Discover skills, intercoder
  # kappa pipeline, report_manager summaries/MECE/narratives, adaptive
  # interview clarify/saturation, deployment follow-up) through the
  # AgenticDispatcher behind the same `agentic_core` feature flag with the
  # legacy ollama/llm_router branch preserved alongside it, so the sites
  # stayed allowlisted and the ratchet stayed at 70 until the legacy branch
  # was retired.
  # W6 routed the 14 autoresearch-runner chat sites (model_temp
  # evaluate/score, persona hypothesize/evaluate/score, question_bank
  # hypothesize/evaluate/score, rag_params hypothesize, skill_prompt
  # hypothesize/evaluate/score, ui_sim hypothesize/evaluate) through the
  # AgenticDispatcher behind the same `agentic_core` feature flag with the
  # legacy llm_router branch preserved alongside it, so the sites stayed
  # allowlisted and the ratchet stayed at 70 until the legacy branch was
  # retired. The rag_params retrieval-eval embed migrated with the other
  # embed sites in W8 (see the W8 note below).
  # W7 routed the 7 validation/consensus/dual-coder chat sites (validation.py
  # dual_run/full_ensemble/self_moa ensembles, adversarial_review + debate
  # completions, validation_executor LLM-as-judge, research_validity_service
  # dual-coder) through the AgenticDispatcher behind the same `agentic_core`
  # feature flag with the legacy llm_router/server/node branch preserved
  # alongside it, so the sites stayed allowlisted and the ratchet stayed at
  # 70 until the legacy branch was retired. The W7 migration also fixed the
  # latent validation_executor judge bug (registry returns message.content;
  # the old code read a top-level "content" key and silently degraded to the
  # default pass).
  # W8 migrated all 17 embed sites: the wrappers (embeddings.py embed_text /
  # embed_chunks / ensure_embed_model, validation.py _get_embeddings) now route
  # through agentic.embed — legacy engine: the unchanged ollama.embed* plane
  # via the dispatcher's permanent legacy executor; Pi engine: the W8
  # EmbeddingsGateway (pi_runtime/embeddings_gateway.py). The 14 wrapper
  # consumers inherit the dispatch with zero edits. The W8 migration also
  # fixed the latent W1 legacy-executor embed bug (OllamaClient.embed_batch
  # takes no project_id kwarg; passing it raised TypeError on the real
  # client). The ratchet drops by 17.
  # W9 (final): retired the preserved per-site legacy branches in the 53
  # remaining product sites (W4 A2A ×3, W5 skills/reports/interviews ×28,
  # W6 autoresearch runners ×14, W7 validation/consensus/dual-coder ×7 +
  # the validation_executor judge). The dispatcher path is now the ONLY
  # path in product code; the legacy engine is reached exclusively through
  # the dispatcher's permanent legacy executor (agentic/legacy.py, see
  # `permanent` below), so behavior under engine="legacy" is preserved by
  # construction. `product` is empty and the ratchet is 0 — any NEW direct
  # legacy-plane call in backend/app/ fails CI from here on.
  expected_product_sites: 0

# ---------------------------------------------------------------------------
# PRODUCT SITES — NONE REMAIN (W9 final state). All 87 W0 product sites route
# through the AgenticDispatcher. Adding an entry here requires a governed
# exception; prefer deleting the direct call instead.
# ---------------------------------------------------------------------------
product: []

