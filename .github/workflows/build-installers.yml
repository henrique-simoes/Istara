name: Build Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty for auto CalVer)'
        required: false
      publish:
        description: 'Publish a GitHub release (false = build and upload artifacts only)'
        type: boolean
        default: true

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  TAURI_CLI_VERSION: "2"

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether this push is release-worthy
        id: detect
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "reason=tag push" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${GITHUB_SHA}"

          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          SHOULD_RELEASE=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              backend/*|frontend/*|desktop/*|relay/*)
                SHOULD_RELEASE=true
                ;;
              .github/workflows/*)
                SHOULD_RELEASE=true
                ;;
              istara.sh|scripts/install-istara.sh|scripts/install.sh|scripts/uninstall-istara.sh|scripts/prepare-release.sh|scripts/set-version.sh)
                SHOULD_RELEASE=true
                ;;
              scripts/check_integrity.py|scripts/check_change_obligations.py|scripts/check_ci_governance.py|scripts/check_test_harness.py|scripts/production_rehearsal.py|scripts/security_benchmark.py|scripts/security_release_readiness.py)
                SHOULD_RELEASE=true
                ;;
              AGENTS.md|CLAUDE.md|README.md|README.pt-BR.md|TESTING.md|Tech.md|security/*|testing/*|docs/features/*)
                SHOULD_RELEASE=true
                ;;
              backend/app/agents/personas/*)
                SHOULD_RELEASE=true
                ;;
            esac
            if [[ "$SHOULD_RELEASE" == "true" ]]; then
              break
            fi
          done <<< "$CHANGED"

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          if [[ "$SHOULD_RELEASE" == "true" ]]; then
            echo "reason=release-worthy main push" >> "$GITHUB_OUTPUT"
          else
            echo "reason=no release-worthy files changed" >> "$GITHUB_OUTPUT"
          fi

  # ── Set Version ────────────────────────────────────────────────────
  version:
    needs: detect-release
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif python3 scripts/check_version_drift.py --newer-than-latest-tag >/dev/null 2>&1; then
            # The tree was prepared for a release (scripts/set-version.sh): ship that version.
            VERSION=$(tr -d '[:space:]' < VERSION)
          else
            # CalVer: YYYY.MM.DD[.N]
            TODAY=$(date -u +%Y.%m.%d)
            LATEST_TAG=$(git ls-remote --tags --refs origin "v*" | awk '{print $2}' | sed 's#refs/tags/v##' | sort -V | tail -1)
            if [[ "$LATEST_TAG" == "$TODAY"* ]]; then
              # Same day — increment build number
              BUILD=$(echo "$LATEST_TAG" | awk -F. '{print ($4 ? $4+1 : 2)}')
              VERSION="${TODAY}.${BUILD}"
            else
              VERSION="$TODAY"
            fi
          fi
          SEMVER=$(bash scripts/set-version.sh --semver-of "$VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "Building Istara $VERSION (desktop $SEMVER)"

  # ── macOS Build ────────────────────────────────────────────────────
  build-macos:
    needs: version
    if: needs.version.result == 'success'
    runs-on: macos-latest
    outputs:
      signing: ${{ steps.dmg.outputs.signing }}
    env:
      APPLE_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        run: |
          chmod +x scripts/set-version.sh
          ./scripts/set-version.sh "${{ needs.version.outputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage the source the app installs on first run
        run: python scripts/stage_desktop_bundle.py

      # Developer ID signing and notarisation need the APPLE_* secrets. Without them the app is
      # ad-hoc signed: it runs, but Gatekeeper asks the user to approve it on first open.
      - name: Build Tauri app (universal, Developer ID)
        if: env.APPLE_SIGNED == 'true'
        working-directory: desktop
        run: npx tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Build Tauri app (universal, ad-hoc signed)
        if: env.APPLE_SIGNED != 'true'
        working-directory: desktop
        run: >-
          npx tauri build --target universal-apple-darwin
          --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify the bundle
        run: |
          APP=desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Istara.app
          test -f "$APP/Contents/Resources/istara/backend/app/main.py"
          test -f "$APP/Contents/Resources/istara/VERSION"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Authority|TeamIdentifier" || true
          ls desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

      - name: Name the DMG for the cask
        run: |
          mkdir -p installer/macos
          DMG=$(find desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          cp "$DMG" "installer/macos/Istara-${{ needs.version.outputs.version }}.dmg"
          echo "signing=$([ "$APPLE_SIGNED" = true ] && echo developer-id || echo ad-hoc)" >> "$GITHUB_OUTPUT"
        id: dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Istara-macOS-${{ needs.version.outputs.version }}
          path: |
            installer/macos/Istara-*.dmg
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz.sig
          retention-days: 30
          if-no-files-found: error

  # ── Linux Build ───────────────────────────────────────────────────
  build-linux:
    needs: version
    if: needs.version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        run: |
          chmod +x scripts/set-version.sh
          ./scripts/set-version.sh "${{ needs.version.outputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage the source the app installs on first run
        run: python scripts/stage_desktop_bundle.py

      - name: Build Tauri app
        working-directory: desktop
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify the bundles
        run: |
          B=desktop/src-tauri/target/release/bundle
          ls $B/appimage/*.AppImage.sig
          dpkg-deb -c $B/deb/*.deb | grep -q "istara/backend/app/main.py"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Istara-Linux-${{ needs.version.outputs.version }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 30
          if-no-files-found: error

  # ── Windows Build ──────────────────────────────────────────────────
  build-windows:
    needs: version
    if: needs.version.result == 'success'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          chmod +x scripts/set-version.sh
          ./scripts/set-version.sh "${{ needs.version.outputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage the source the app installs on first run
        run: python scripts/stage_desktop_bundle.py

      - name: Build Tauri app
        working-directory: desktop
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify the bundles
        shell: bash
        run: |
          B=desktop/src-tauri/target/release/bundle
          ls $B/nsis/*-setup.exe.sig $B/msi/*.msi.sig
          grep -q "main.py" desktop/src-tauri/target/release/wix/x64/main.wxs
          grep -q "main.py" desktop/src-tauri/target/release/nsis/x64/installer.nsi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Istara-Windows-${{ needs.version.outputs.version }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.msi.sig
          retention-days: 30
          if-no-files-found: error

  # ── Release (on release-worthy main push, tag push, or manual) ────
  release:
    if: >-
      needs.detect-release.outputs.should_release == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish)
    needs: [detect-release, version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release summary
        run: |
          echo "Release reason: ${{ needs.detect-release.outputs.reason }}"
          echo "Release version: ${{ needs.version.outputs.version }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List all artifacts
        run: find . -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.tar.gz" -o -name "*.sig" \) | sort

      # The updater compares latest.json's version with the app's own semver, and refuses any
      # update without a valid signature, so both must be right or nobody updates.
      - name: Generate latest.json for auto-updater
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SEMVER: ${{ needs.version.outputs.semver }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, sys
          version, semver = os.environ["VERSION"], os.environ["SEMVER"]
          base = f"https://github.com/henrique-simoes/Istara/releases/download/v{version}"
          def one(pattern):
              found = sorted(p for p in pathlib.Path(".").rglob(pattern) if p.is_file())
              if not found:
                  sys.exit(f"No release artifact matches {pattern}")
              return found[0]
          def entry(pattern):
              artifact = one(pattern)
              signature = pathlib.Path(f"{artifact}.sig")
              if not signature.is_file() or not signature.read_text().strip():
                  sys.exit(f"{artifact.name} has no updater signature")
              return {"signature": signature.read_text().strip(), "url": f"{base}/{artifact.name}"}
          mac = entry("Istara-macOS-*/**/*.app.tar.gz")
          latest = {
              "version": semver,
              "notes": f"Istara {version}. See the release page for details.",
              "pub_date": datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": mac,
                  "darwin-x86_64": mac,
                  "windows-x86_64": entry("Istara-Windows-*/**/*-setup.exe"),
                  "linux-x86_64": entry("Istara-Linux-*/**/*.AppImage"),
              },
          }
          pathlib.Path("latest.json").write_text(json.dumps(latest, indent=2) + "\n")
          print(json.dumps(latest, indent=2))
          PY

      - name: Render the Homebrew cask
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          DMG=$(find Istara-macOS-* -name "Istara-${VERSION}.dmg" | head -1)
          SHA=$(sha256sum "$DMG" | cut -d' ' -f1)
          sed -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" homebrew/istara.rb > istara.rb
          grep -E '^  (version|sha256) ' istara.rb

      # The tap (henrique-simoes/homebrew-istara) is updated only when a token that can push to
      # it is configured; otherwise the rendered cask is attached to the release.
      - name: Update the Homebrew tap
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the tap still serves the previous cask. istara.rb is attached to the release."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/henrique-simoes/homebrew-istara.git" tap
          cp istara.rb tap/Casks/istara.rb
          cd tap
          git config user.name "istara-release"
          git config user.email "istara-release@users.noreply.github.com"
          git add Casks/istara.rb
          git diff --cached --quiet || { git commit -m "istara ${VERSION}" && git push; }

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            latest.json
            Istara-macOS-*/**/*.dmg
            Istara-macOS-*/**/*.tar.gz
            Istara-Windows-*/**/*.exe
            Istara-Windows-*/**/*.msi
            Istara-Linux-*/**/*.AppImage
            Istara-Linux-*/**/*.deb
            Istara-Linux-*/**/*.rpm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Istara ${{ needs.version.outputs.version }}
          body: |
            ## Istara ${{ needs.version.outputs.version }}

            ### Installation

            **macOS (Homebrew)**:
            ```bash
            brew install --cask henrique-simoes/istara/istara
            ```

            **macOS (shell one-liner)**:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/henrique-simoes/Istara/main/scripts/install-istara.sh | sh
            ```

            **macOS (manual)**: Download the `.dmg`, drag Istara to Applications

            **Windows**: Download the `-setup.exe` (or `.msi`) installer and run it

            **Linux**: Download the `.AppImage` (or the `.deb` / `.rpm`)

            macOS signing for this build: **${{ needs.build-macos.outputs.signing }}**. An ad-hoc
            signed app is not notarised: on first open, approve it in System Settings → Privacy &
            Security ("Open Anyway").

            **Docker**:
            ```bash
            git clone https://github.com/henrique-simoes/Istara.git && cd Istara
            cp .env.example .env && docker compose up -d
            ```

            ### Updates
            Existing users: the app checks for updates automatically on startup and shows "Update Now" when a new version is available. Or click **Check for Updates** in the system tray menu.

            ---
            *Full changelog and documentation: [Wiki](https://github.com/henrique-simoes/Istara/wiki)*
          files: |
            latest.json
            istara.rb
            Istara-macOS-*/**/*.dmg
            Istara-macOS-*/**/*.tar.gz
            Istara-macOS-*/**/*.tar.gz.sig
            Istara-Windows-*/**/*.exe
            Istara-Windows-*/**/*.exe.sig
            Istara-Windows-*/**/*.msi
            Istara-Windows-*/**/*.msi.sig
            Istara-Linux-*/**/*.AppImage
            Istara-Linux-*/**/*.AppImage.sig
            Istara-Linux-*/**/*.deb
            Istara-Linux-*/**/*.rpm
          generate_release_notes: true
          draft: false
          prerelease: false
