name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync README version badges
        if: github.event_name == 'push'
        run: |
          VERSION=$(cat VERSION)
          # English README
          sed -i "s|version-[0-9][0-9.]*-brightgreen|version-${VERSION}-brightgreen|g" README.md
          # Portuguese README
          sed -i "s|versão-[0-9][0-9.]*-brightgreen|versão-${VERSION}-brightgreen|g" README.pt-BR.md
          if [ -n "$(git diff -- README.md README.pt-BR.md)" ]; then
            git add README.md README.pt-BR.md
            git commit -m "ci: sync README version badges to ${VERSION} [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || echo "Push failed (token permissions)"
          fi

      - name: Check integrity
        run: python scripts/check_integrity.py

      - name: Check CI/CD governance
        run: python scripts/check_ci_governance.py

      - name: Check test harness governance
        run: python scripts/check_test_harness.py

      - name: Check security benchmark
        run: python scripts/security_benchmark.py --fail-on-threshold --output security/security_scorecard.json

      - name: Check change obligations
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          python scripts/check_change_obligations.py --base "$BASE" --head "$HEAD"

      - name: Check PR security benchmark triggers
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$BASE..$HEAD" > security_changed_files.txt
          python scripts/security_benchmark.py --changed-paths-file security_changed_files.txt --fail-on-threshold --output security/security_scorecard.json

      - name: Upload security scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istara-security-scorecard
          path: security/security_scorecard.json
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Compile governed release surfaces
        run: python -m compileall -q app ../scripts/production_rehearsal.py ../scripts/check_ci_governance.py ../scripts/check_change_obligations.py ../scripts/check_integrity.py ../scripts/check_ruff_changed.py ../scripts/security_benchmark.py ../scripts/check_test_harness.py ../scripts/run_backend_mutation.py

      - name: Run production rehearsal
        run: python ../scripts/production_rehearsal.py --json

      - name: Run test harness contract smoke tests
        run: pytest ../tests/test_harness_config.py ../tests/test_agentic_eval_contract.py -q

      - name: Run property-based contract tests
        run: pytest ../tests/test_property_contracts.py -q

      - name: Run backend mutation gate
        run: python ../scripts/run_backend_mutation.py

      - name: Run governed evolution regressions
        run: pytest ../tests/test_improvement_governance.py ../tests/test_compute.py -q

      - name: Strict lint for changed backend files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="${{ github.event.before }}"
          fi
          HEAD_SHA="${{ github.sha }}"
          python ../scripts/check_ruff_changed.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Lint
        run: ruff check . --statistics
        continue-on-error: true  # TODO: fix 1159 existing lint errors, then make blocking

      - name: Format check
        run: ruff format --check .
        continue-on-error: true  # TODO: fix 146 files needing reformat, then make blocking

      - name: Test
        run: pytest ../tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Mutation tests
        run: npm run test:mutation

      - name: Build
        run: npm run build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Check Rust compiles
        run: cargo check
        continue-on-error: true  # Dependencies may require system libs not available in CI
