name: CI

on:
  push:
    branches: [main, staging, testing]
  pull_request:
    branches: [main, staging, testing]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  feature-obligations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify feature obligations (fail-closed)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          python scripts/check_feature_obligations.py --base "$BASE" --head "$HEAD" \
            --json-out artifacts/feature-obligations.json

      - name: Validate QA capability declaration
        run: python scripts/check_qa_capabilities.py

      - name: Validate public workflow human-gate contract
        run: python scripts/check_workflow_contracts.py

      - name: Upload obligation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istara-feature-obligations
          path: artifacts/feature-obligations.json
          if-no-files-found: ignore

  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync README version badges
        if: github.event_name == 'push'
        run: |
          VERSION=$(cat VERSION)
          # English README
          sed -i "s|version-[0-9][0-9.]*-brightgreen|version-${VERSION}-brightgreen|g" README.md
          # Portuguese README
          sed -i "s|versão-[0-9][0-9.]*-brightgreen|versão-${VERSION}-brightgreen|g" README.pt-BR.md
          if [ -n "$(git diff -- README.md README.pt-BR.md)" ]; then
            git add README.md README.pt-BR.md
            git commit -m "ci: sync README version badges to ${VERSION} [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || echo "Push failed (token permissions)"
          fi

      - name: Check integrity
        run: python scripts/check_integrity.py

      - name: Check CI/CD governance
        run: python scripts/check_ci_governance.py

      - name: Check test harness governance
        run: python scripts/check_test_harness.py

      - name: Check release security readiness
        run: python scripts/security_release_readiness.py

      - name: Check security benchmark
        run: python scripts/security_benchmark.py --fail-on-threshold --output security/security_scorecard.json

      - name: Check change obligations
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          python scripts/check_change_obligations.py --base "$BASE" --head "$HEAD"

      - name: Check PR security benchmark triggers
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$BASE..$HEAD" > security_changed_files.txt
          python scripts/security_benchmark.py --changed-paths-file security_changed_files.txt --fail-on-threshold --output security/security_scorecard.json

      - name: Upload security scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istara-security-scorecard
          path: security/security_scorecard.json
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Compile governed release surfaces
        run: python -m compileall -q app ../scripts/production_rehearsal.py ../scripts/check_ci_governance.py ../scripts/check_change_obligations.py ../scripts/check_integrity.py ../scripts/check_ruff_changed.py ../scripts/security_benchmark.py ../scripts/security_release_readiness.py ../scripts/check_test_harness.py ../scripts/run_backend_mutation.py

      - name: Run production rehearsal
        run: python ../scripts/production_rehearsal.py --json

      - name: Run test harness contract smoke tests
        run: pytest ../tests/test_harness_config.py ../tests/test_agentic_eval_contract.py ../tests/test_harness_project_scope_contracts.py ../tests/test_marathon_config_integrity.py -q

      - name: Run property-based contract tests
        run: pytest ../tests/test_property_contracts.py -q

      - name: Run backend mutation gate
        run: python ../scripts/run_backend_mutation.py

      - name: Run governed evolution regressions
        run: pytest ../tests/test_improvement_governance.py ../tests/test_compute.py -q

      - name: Strict lint for changed backend files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="${{ github.event.before }}"
          fi
          HEAD_SHA="${{ github.sha }}"
          python ../scripts/check_ruff_changed.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Lint
        run: ruff check . --statistics
        continue-on-error: true  # TODO: fix 1159 existing lint errors, then make blocking

      - name: Format check
        run: ruff format --check .
        continue-on-error: true  # TODO: fix 146 files needing reformat, then make blocking

      - name: Test
        run: pytest ../tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Mutation tests
        run: npm run test:mutation

      - name: Build
        run: npm run build

  test-harness-js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install relay dependencies
        working-directory: relay
        run: npm ci

      - name: Run relay unit tests
        working-directory: relay
        run: npm test

      - name: Run simulation static checks
        working-directory: tests/simulation
        run: npm run test:static

      - name: Run real-user benchmark static checks
        working-directory: tests/real_user_benchmark
        run: npm run check

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Check Rust compiles
        run: cargo check
        continue-on-error: true  # Dependencies may require system libs not available in CI

  qa-artifact:
    runs-on: ubuntu-latest
    needs: [feature-obligations, governance, backend, frontend, test-harness-js]
    permissions:
      contents: read
      packages: write  # trusted `testing` runs may publish a QA image to GHCR
      id-token: write  # provenance attestation
    if: ${{ github.event_name == 'push' && github.ref_name == 'testing' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate QA compose contract (no services started)
        run: docker compose -f docker-compose.qa.yml --profile contract config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (trusted testing runs only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build disposable QA image (immutable tag)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/istara-qa:${{ github.sha }}
            ghcr.io/${{ github.repository }}/istara-qa:qa-run-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: true
          sbom: true

      - name: Record image digest + evidence manifest
        run: |
          mkdir -p artifacts
          DIGEST=$(docker buildx imagetools inspect ghcr.io/${{ github.repository }}/istara-qa:${{ github.sha }} --format '{{.Manifest.Digest}}')
          printf '%s' "$DIGEST" > artifacts/docker-image-digest.txt
          cat > artifacts/qa-artifact-manifest.json <<EOF
          {
            "source_sha": "${{ github.sha }}",
            "image_digest": "$DIGEST",
            "run_id": "${{ github.run_id }}",
            "attempt": "${{ github.run_attempt }}",
            "provider_mode": "contract",
            "human_gate_required": true
          }
          EOF

      - name: Upload QA artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: istara-qa-artifact-evidence
          path: artifacts/

  qa-contract-stack:
    runs-on: ubuntu-latest
    needs: [feature-obligations]
    permissions:
      contents: read
    if: ${{ always() && needs.feature-obligations.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render QA profiles
        run: |
          docker compose -f docker-compose.qa.yml --profile contract config --quiet
          docker compose -f docker-compose.qa.yml --profile synthetic config --quiet
          docker compose -f docker-compose.qa.yml --profile audit config --quiet

      - name: Run QA contract tests
        run: |
          pytest tests/test_qa_stack_contract.py tests/test_qa_reset_seed.py \
            tests/test_qa_artifacts.py tests/test_feature_obligations.py \
            tests/test_qa_capabilities.py -q
