# Istara testing acceptance stack for the managed VPS (Dokploy) — owner-approved 2026-08-22.
# Connectivity exception (vps skill): multi-service (postgres+backend+frontend) required for
# login/onboarding acceptance; no Ollama/relay/otel/jaeger/caddy. Only frontend:13080 is
# published publicly; backend:18080 is published loopback-only for diagnostics; postgres is
# internal-only. No volumes are persisted (fresh DB each deploy — intentional for testing).
services:
  postgres:
    image: postgres:16-alpine
    container_name: istara-test-postgres
    expose: ["5432"]
    networks: [data-net]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-istara}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-istara}
      - POSTGRES_DB=${POSTGRES_DB:-istara}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-istara}"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=100M", "/run/postgresql:noexec,nosuid,size=50M"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - INSTALL_WHISPER=false
    container_name: istara-test-backend
    expose: ["8000"]
    ports:
      - "127.0.0.1:18080:8000"
    networks: [backend-net, data-net]
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:latest}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - DATABASE_URL=postgresql+asyncpg://istara:istara@postgres:5432/istara
      - POSTGRES_SSL=false
      - LANCE_DB_PATH=/app/data/lance_db
      - UPLOAD_DIR=/app/data/uploads
      - PROJECTS_DIR=/app/data/projects
      - CORS_ORIGINS=${CORS_ORIGINS:-http://2.24.66.167:13080,http://127.0.0.1:13080}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - TEAM_MODE=${TEAM_MODE:-true}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - MCP_SERVER_ENABLED=${MCP_SERVER_ENABLED:-false}
      - AUTORESEARCH_ENABLED=${AUTORESEARCH_ENABLED:-false}
      - RESOURCE_RESERVE_RAM_GB=${RESOURCE_RESERVE_RAM_GB:-1}
      - RESOURCE_RESERVE_CPU_PERCENT=${RESOURCE_RESERVE_CPU_PERCENT:-10}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=100M", "/app/data:size=512M,uid=999,gid=999,mode=0750"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, NET_BIND_SERVICE]
    pids_limit: 200
    mem_limit: 2G
    cpus: "1.5"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://2.24.66.167:18080}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://2.24.66.167:18080/ws}
    container_name: istara-test-frontend
    expose: ["3000"]
    ports:
      - "13080:3000"
    networks: [frontend-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=100M", "/.next/cache:noexec,nosuid,size=200M"]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 512M
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true
  data-net:
    driver: bridge
    internal: true
