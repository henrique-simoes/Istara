[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --strict-markers
markers =
    acceptance: end-to-end user acceptance checks and production rehearsals
    agentic_eval: agentic orchestration, tool-calling, and LLM-as-judge evaluation contracts
    benchmark: deterministic benchmark or scorecard tests
    contract: system-wide API, feature, and governance contract tests
    e2e: full-stack tests that need a running backend or frontend
    live_llm: opt-in tests that call configured live LLM providers
    mutation: mutation-testing harness checks
    security: auth, session, secret, permission, and infrastructure security tests
    simulation: Playwright or Node simulation scenarios
    ui: browser-visible UI and UX checks
