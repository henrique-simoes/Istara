# Feature → obligation coverage registry (SINGLE AUTHORITY).
#
# Every changed behavioral path must be owned by exactly one feature entry here
# (overlapping matches are allowed only when the union is intentional and
# tested). `scripts/check_feature_obligations.py` reads this file on every CI
# run and FAILS CLOSED when a changed path matches no feature and is not on the
# audited mechanical allowlist.
#
# Obligation vocabulary (deterministic):
#   governance, ci_governance, test_harness, public_tree, feature_obligations,
#   security_benchmark, backend_contracts, research_spine_contract,
#   provider_contracts, synthetic_provisional, qa_stack_contract,
#   qa_artifact_contract, feature_docs, project_scope, frontend_contracts,
#   relay_contracts, mutation_property, workflow_contract
# Optional (owner-authorized only, never a default PR requirement):
#   authorized_live, staging_adapter
#
# Fields:
#   id: dotted feature id (stable)
#   status: active | deprecated
#   owner: owning team/persona
#   paths: git path patterns owned by this feature (fnmatch)
#   exceptions: narrow, reviewed exceptions (never backend/frontend/security behavior)
#   requires_human_review: true for spine/report/security/promotion surfaces
#   docs_features_update: true when UI/menu/route/store/agent/skill/model/test behavior changes
#   obligations.deterministic: required deterministic checks
#   obligations.live: owner-authorized optional lanes (never satisfy deterministic)
#   commands.deterministic: pinned commands (see COMMAND_CATALOG in the classifier)
#   acceptance: what this feature must prove
#   introduced_in / last_verified_sha: provenance so stale coverage is visible

schema_version: 1

allowlist:
  - "*.md"
  - "*.txt"
  - "docs/**"
  - "*.png"
  - "*.svg"
  - "*.gif"
  - "LICENSE"
  - "VERSION"
  - ".gitignore"
  - ".gitattributes"
  - ".editorconfig"
  - ".nvmrc"
  - ".node-version"
  - "Caddyfile"
  - "pytest.ini"
  - "Vagrantfile"
  - "Makefile"
  - "Procfile"
  - "*.example"
  - "*.yml.dist"
  - "installer/**"
  - "desktop/src-tauri/icons/**"
  - "desktop/src-tauri/tauri.conf.json"
  - "docs/features/site/**"

