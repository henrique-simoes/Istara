# Disposable QA runtime overlay (public, provider-agnostic).
#
# This file defines the QA stack contract from the winning master plan (§7-§8):
#   * profile-gated: `contract` (default), `synthetic`, `reset`, `audit`,
#     `live` (owner-authorized, one target), `ui` (loopback publish only);
#   * NO local model services in the default profile (no ollama/lmstudio);
#   * NO fixed `container_name` — every run uses a unique project
#     (`istara-qa-<run-id>`) so volumes/networks never collide across runs;
#   * backend/data networks stay internal; the UI lane publishes only
#     loopback ports for the browser and its API;
#   * hardened defaults carried from the base compose: read_only, cap_drop ALL,
#     no-new-privileges, pids_limit, mem_limit, internal networks;
#   * product containers never mount the host Docker socket.
#
# Render check (CI-safe):
#   docker compose -f docker-compose.qa.yml --profile contract config --quiet
#
# The `live` profile fails closed at render time unless QA_LIVE_PROVIDER_TARGET
# names exactly one target from qa/runtime_capabilities.json.
#
# `multivac` is an optional owner-local staging adapter, never referenced here
# and never part of the public QA path.

name: istara-qa-${QA_RUN_ID:-local}

x-qa-hardening: &qa-hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: "no"

services:
  qa-backend:
    # One QA image built from the repo root: the product backend PLUS the QA
    # tooling (qa/scripts, qa/corpora) the seeder/resetter/auditor need.
    build:
      context: .
      dockerfile: qa/Dockerfile
    <<: *qa-hardening
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
      # The application creates its disposable SQLite/Lance/upload/runtime
      # tree during startup; keep the root read-only and expose only this
      # bounded in-memory QA data surface.
      - /app/data:rw,nosuid,nodev,uid=999,gid=999,mode=0750,size=2G
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    networks:
      - qa-backend-net
      - qa-data-net
    depends_on:
      qa-provider-stub:
        condition: service_healthy
    environment:
      # Deterministic contract mode: this is an in-network wire stub, not a
      # model service. The backend uses the Ollama protocol shape only so its
      # real provider and vector-space guards execute without a live provider.
      LLM_PROVIDER: ${QA_LLM_PROVIDER:-ollama}
      OLLAMA_HOST: ${QA_OLLAMA_HOST:-http://qa-provider-stub:11434}
      # The provider plane below is a deterministic wire stub, not a model
      # service. Interactive chat fails closed on this marker (CF-SPEC-1).
      LLM_PROVIDER_CONTRACT_STUB: "true"
      OLLAMA_MODEL: ${QA_OLLAMA_MODEL:-istara-qa-contract-chat:latest}
      OLLAMA_EMBED_MODEL: ${QA_OLLAMA_EMBED_MODEL:-istara-qa-contract-embed:latest}
      LLM_FALLBACK_ENABLED: "false"
      MCP_SERVER_ENABLED: "false"
      AUTORESEARCH_ENABLED: "false"
      RATE_LIMIT_ENABLED: "true"
      # The loopback-only Caddy proxy is a separate container, so the backend
      # sees its bridge address rather than 127.0.0.1. This optional token is
      # reserved for explicit relay/compute probes; the Browser path does not
      # receive or require it, and production credentials must never be used.
      NETWORK_ACCESS_TOKEN: ${QA_NETWORK_ACCESS_TOKEN:-}
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      JWT_SECRET: ${QA_JWT_SECRET:-qa-only-not-a-production-secret}
      DATA_ENCRYPTION_KEY: ${QA_DATA_ENCRYPTION_KEY:-istara-qa-only-field-encryption-key-rotate-on-real-data}
      DATABASE_URL: ${QA_DATABASE_URL:-sqlite+aiosqlite:////tmp/istara-qa.db}
      QA_RUN_ID: ${QA_RUN_ID:-local}
      QA_MODE: ${QA_MODE:-contract}
      # The browser lane may opt into team-mode bootstrap so the UI can
      # exercise real registration/login/session flows through the proxy.
      # Local mode remains the default for non-UI contract runs.
      TEAM_MODE: ${QA_TEAM_MODE:-false}
      # Optional deterministic first-admin credentials for an explicitly
      # reset disposable UI lane; leave the password unset outside QA.
      ADMIN_USERNAME: ${QA_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${QA_ADMIN_PASSWORD:-}
      # One-target live lane: fails closed unless explicitly authorized.
      QA_LIVE_PROVIDER_TARGET: ${QA_LIVE_PROVIDER_TARGET:-}
      QA_LIVE_MODEL: ${QA_LIVE_MODEL:-}
      QA_LIVE_EMBED_MODEL: ${QA_LIVE_EMBED_MODEL:-}
    pids_limit: 200
    mem_limit: 4G
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # The Browser runs on the Mac host, while the backend/data services remain
  # on internal QA networks. This loopback-only Caddy bridge is the sole host
  # API entry point for the UI profile; it never publishes the backend itself.
  qa-api-proxy:
    image: caddy:2-alpine
    <<: *qa-hardening
    # Caddy's Alpine binary needs this minimal capability when all ambient
    # capabilities are dropped, even though the published port is 8000.
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /data:noexec,nosuid,size=16M
      - /config:noexec,nosuid,size=16M
    ports:
      - "127.0.0.1:${QA_API_PORT:-8000}:8000"
    networks:
      - qa-frontend-net
      - qa-backend-net
    depends_on:
      qa-backend:
        condition: service_healthy
    volumes:
      - ./qa/Caddyfile:/etc/caddy/Caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    pids_limit: 32
    mem_limit: 128M
    cpus: "0.25"
    profiles:
      - ui

  qa-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The UI profile is published on 127.0.0.1 and the API proxy uses a
        # separate loopback port. Keep the default hostname identical so
        # Fetch Metadata does not classify authentication as cross-site.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://127.0.0.1:8000}
    <<: *qa-hardening
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
      - /.next/cache:noexec,nosuid,size=200M
    networks:
      - qa-frontend-net
    depends_on:
      qa-backend:
        condition: service_healthy
    pids_limit: 100
    mem_limit: 512M

  # Provider contract stub: bounded, in-network, deterministic. Proves
  # request/response plumbing only — it never claims model or research quality.
  # It implements a tiny Ollama-compatible wire surface but never loads a model
  # or makes an outbound request.
  qa-provider-stub:
    build:
      context: .
      dockerfile: qa/provider-stub.Dockerfile
    <<: *qa-hardening
    tmpfs:
      - /tmp:noexec,nosuid,size=16M
    environment:
      QA_CONTRACT_CHAT_MODEL: ${QA_OLLAMA_MODEL:-istara-qa-contract-chat:latest}
      QA_CONTRACT_EMBED_MODEL: ${QA_OLLAMA_EMBED_MODEL:-istara-qa-contract-embed:latest}
    networks:
      - qa-data-net
    pids_limit: 32
    mem_limit: 128M
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11434/api/tags', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - contract
      - synthetic
      - reset
      - audit
      - live
      - ui

  # Synthetic corpus seeder (Research Spine provisional-only). Ingests the
  # named slice through the REAL evidence-unit path (POST /api/documents on
  # the running qa-backend) and writes the seed manifest with live handles.
  qa-seeder:
    build:
      context: .
      dockerfile: qa/Dockerfile
    <<: *qa-hardening
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    networks:
      - qa-data-net
    depends_on:
      qa-backend:
        condition: service_healthy
    environment:
      QA_RUN_ID: ${QA_RUN_ID:-local}
      QA_SLICE: ${QA_SLICE:-coding-reliability}
      QA_RUNS_DIR: /qa/runs
      QA_API_BASE: ${QA_API_BASE:-http://qa-backend:8000}
    volumes:
      # Bind the gitignored artifact dir so host-side collect/audit can read
      # the seed manifest; the QA runtime never mounts the Docker socket.
      - ./qa/runs:/qa/runs
    command:
      - sh
      - -c
      - python qa/scripts/seed_synthetic.py --slice "$${QA_SLICE}" --run-id "$${QA_RUN_ID}" --runs-dir "$${QA_RUNS_DIR}" --api-base "$${QA_API_BASE}"
    profiles:
      - synthetic
      - reset

  # Resetter: wipes ONLY this project's volumes/networks and reseeds.
  qa-resetter:
    build:
      context: .
      dockerfile: qa/Dockerfile
    <<: *qa-hardening
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
    networks:
      - qa-data-net
    environment:
      QA_RUN_ID: ${QA_RUN_ID:-local}
      QA_CONFIRM: ${QA_CONFIRM:-RESET-ISTARA-QA-RUN}
    command:
      - sh
      - -c
      - python qa/scripts/reset_qa.py --run-id "$${QA_RUN_ID}" --confirm "$${QA_CONFIRM}" --dry-run
    profiles:
      - reset

  # Auditor: provenance/retention/redaction evidence for the gate bundle.
  qa-auditor:
    build:
      context: .
      dockerfile: qa/Dockerfile
    <<: *qa-hardening
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
    networks:
      - qa-data-net
    environment:
      QA_RUN_ID: ${QA_RUN_ID:-local}
      QA_RUNS_DIR: /qa/runs
      QA_SOURCE_SHA: ${QA_SOURCE_SHA:-}
      QA_IMAGE_DIGEST: ${QA_IMAGE_DIGEST:-}
    volumes:
      - ./qa/runs:/qa/runs
    command:
      - sh
      - -c
      - python qa/scripts/audit_qa.py --run-id "$${QA_RUN_ID}" --runs-dir "$${QA_RUNS_DIR}" --source-sha "$${QA_SOURCE_SHA}" --image-digest "$${QA_IMAGE_DIGEST}"
    profiles:
      - audit

  # Live lane: owner-authorized, one explicit target; the gate command fails
  # closed unless QA_LIVE_PROVIDER_TARGET is set (runtime, not render-time, so
  # non-live profiles always render without a target).
  qa-live-gate:
    image: busybox:1.36
    <<: *qa-hardening
    # F-4: the gate must never echo QA_LIVE_PROVIDER_TARGET (a private endpoint)
    # verbatim into logs; it emits only a redacted checksum label/handle.
    command: ["sh", "-c", "test -n \"$${QA_LIVE_PROVIDER_TARGET}\" || { echo 'QA_LIVE_PROVIDER_TARGET is required for the live profile'; exit 1; }; echo live-target-set=1; echo \"live-target-label=$$(printf '%s' \"$${QA_LIVE_PROVIDER_TARGET}\" | cksum | cut -d' ' -f1)\""]
    environment:
      QA_LIVE_PROVIDER_TARGET: ${QA_LIVE_PROVIDER_TARGET:-}
    networks:
      - qa-data-net
    profiles:
      - live

  # UI profile: publish the frontend on loopback only (127.0.0.1).
  qa-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://127.0.0.1:8000}
    <<: *qa-hardening
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
      - /.next/cache:noexec,nosuid,size=200M
    ports:
      - "127.0.0.1:${QA_UI_PORT:-3000}:3000"
    networks:
      - qa-frontend-net
    depends_on:
      qa-backend:
        condition: service_healthy
    pids_limit: 100
    mem_limit: 512M
    profiles:
      - ui

networks:
  qa-frontend-net:
    driver: bridge
    internal: false  # loopback-only publish via qa-ui; no host exposure otherwise
  qa-backend-net:
    driver: bridge
    internal: true
  qa-data-net:
    driver: bridge
    internal: true
