[change_types.local_fix]
blast_radius = "lite"
keywords = ["fix", "bug", "typo", "small", "local", "targeted"]
paths = []
checks = ["targeted verification for touched surface"]
steps = ["inspect local context", "make scoped change", "run targeted verification", "record evidence"]

[change_types.standard_change]
blast_radius = "standard"
keywords = ["api", "model", "ui", "workflow", "feature", "test", "endpoint"]
paths = []
checks = ["tests for touched surface", "architecture gate if boundaries changed"]
steps = ["inspect impact", "create/update tests", "implement", "run verification", "record evidence"]

[change_types.security_or_architecture]
blast_radius = "full"
keywords = ["architecture", "refactor", "security", "auth", "rbac", "permission", "release"]
paths = ["backend/alembic/versions/003_add_mfa_columns.py", "backend/alembic/versions/010_auth_sessions.py", "backend/alembic/versions/011_auth_factor_hardening.py", "backend/alembic/versions/013_recovery_code_audit_events.py", "backend/alembic/versions/014_chat_session_thinking_mode.py", "backend/alembic/versions/015_permission_requests.py", "backend/alembic/versions/017_mcp_audit_project_scope.py", "backend/app/agents/personas/istara-ui-audit/CORE.md", "backend/app/agents/personas/istara-ui-audit/MEMORY.md", "backend/app/agents/personas/istara-ui-audit/PROTOCOLS.md", "backend/app/agents/personas/istara-ui-audit/SKILLS.md", "backend/app/agents/ui_audit_agent.py", "backend/app/api/middleware/auth.py", "backend/app/api/routes/admin.py", "backend/app/api/routes/audit.py", "backend/app/api/routes/auth.py", "backend/app/api/routes/permission_requests.py", "backend/app/api/routes/sessions.py", "backend/app/api/routes/webauthn.py", "backend/app/core/audit_middleware.py"]
checks = ["architecture gate", "security-sensitive surface review", "broad verification for touched layers"]
steps = ["capture baseline", "plan task graph", "implement in scoped slices", "run post-change gate", "record decision"]

