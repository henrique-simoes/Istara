[recipe]
name = "istara-main-pi-replacement"
root_hint = "/Users/user/Documents/Istara-main-pi-replacement"
description = "Inferred Compass Forge recipe. Review and edit project-specific rules as the codebase teaches the tool."

[commands]

[context]
always_include = ["README.md", "AGENTS.md"]
candidate_globs = ["**/*.js", "**/*.jsx", "**/*.py", "**/*.rs", "**/*.ts", "**/*.tsx", "*.md", "Cargo.toml", "docs/**/*.md", "tests/**/*"]
exclude_zones = ["backup", "build-output", "local-db", "runtime-data", "simulation-output", "tool-state", "vendor"]
budget_bytes = 90000
full_bytes = 35000

[gates]
large_file_bytes = 400000
skip_dirs = [".compass-forge", ".git", ".next", ".pytest_cache", ".ruff_cache", ".venv", "Screenshots", "__pycache__", "artifacts", "backups", "build", "cache", "coverage", "data", "dist", "logs", "node_modules", "storage", "target", "tmp", "uploads", "vendor"]
required_paths = ["README.md"]
allowed_large_file_globs = []
ignored_file_globs = ["*.db", "*.log", "*.sqlite3", ".DS_Store", "Screenshots/**", "coverage/**"]
security_sensitive_paths = ["backend/alembic/versions/003_add_mfa_columns.py", "backend/alembic/versions/010_auth_sessions.py", "backend/alembic/versions/011_auth_factor_hardening.py", "backend/alembic/versions/013_recovery_code_audit_events.py", "backend/alembic/versions/014_chat_session_thinking_mode.py", "backend/alembic/versions/015_permission_requests.py", "backend/alembic/versions/017_mcp_audit_project_scope.py", "backend/app/agents/personas/istara-ui-audit/CORE.md", "backend/app/agents/personas/istara-ui-audit/MEMORY.md", "backend/app/agents/personas/istara-ui-audit/PROTOCOLS.md", "backend/app/agents/personas/istara-ui-audit/SKILLS.md", "backend/app/agents/ui_audit_agent.py", "backend/app/api/middleware/auth.py", "backend/app/api/routes/admin.py", "backend/app/api/routes/audit.py", "backend/app/api/routes/auth.py", "backend/app/api/routes/permission_requests.py", "backend/app/api/routes/sessions.py", "backend/app/api/routes/webauthn.py", "backend/app/core/audit_middleware.py", "backend/app/core/auth.py", "backend/app/core/auth_audit.py", "backend/app/core/auth_cookies.py", "backend/app/core/auth_origins.py", "backend/app/core/auth_sessions.py", "backend/app/core/permissions.py", "backend/app/core/token_counter.py", "backend/app/models/auth_session.py", "backend/app/models/mcp_audit_log.py", "backend/app/models/permission_request.py", "backend/app/models/session.py", "backend/app/models/webauthn_challenge.py", "backend/app/models/webauthn_credential.py", "backend/app/skills/definitions/accessibility-audit.json", "backend/app/skills/definitions/browser-ux-audit.json", "backend/app/skills/definitions/design-system-audit.json", "docs/features/content/admin/dashboard/architecture.md", "docs/features/content/admin/dashboard/researcher.md", "docs/features/content/auth/login/architecture.md", "docs/features/content/auth/login/researcher.md", "docs/features/content/chat/sessions/architecture.md", "docs/features/content/chat/sessions/researcher.md", "docs/features/cont